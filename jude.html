<style>
  *{box-sizing:border-box;}

    justify-content:center;

    width:100%;
    max-width:360px;

    color:#f3f1ea;

  .ptag{font-size:10px;letter-spacing:1.5px;color:#8c8880;margin:0 0 24px;}
  .plink{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    background:#3f6fb0;
    color:#fff;
    font-size:14px;
    text-decoration:none;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:opacity .15s ease;
  }
  .plink:hover{opacity:.88;}
</style>
